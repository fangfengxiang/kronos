name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: bufbuild/buf-action@v1.4.0
        with:
          version: '1.70.0'
          setup_only: true
      - name: Check protocol generation
        run: go run ./platform/verify proto
      - name: Check public protocol compatibility
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          KRONOS_PROTOCOL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go run ./platform/verify breaking "$KRONOS_PROTOCOL_BASE"
      - name: Check layer dependencies
        run: go run ./platform/verify deps
      - name: Test independent modules with race detector
        run: go run ./platform/verify test

  order-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      etcd:
        image: gcr.io/etcd-development/etcd@sha256:b29d816b546a1966fe7034a33b34e231fa98c47ce4d2883f70b0555020b22132
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
          ETCD_DATA_DIR: /tmp/kronos-etcd
        ports:
          - 2379/tcp
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: bufbuild/buf-action@v1.4.0
        with:
          version: '1.70.0'
          setup_only: true
      - name: Test real etcd leases
        env:
          KRONOS_ETCD_TEST_ADDRESS: "127.0.0.1:${{ job.services.etcd.ports['2379'] }}"
        run: go -C infra/etcd test -tags=etcd_integration -count=1 -v ./...
      - name: Test Order, official go-micro v2 peers and recovery
        env:
          KRONOS_ETCD_TEST_ADDRESS: "127.0.0.1:${{ job.services.etcd.ports['2379'] }}"
        run: go test -tags=interop,etcd_interop -count=1 -v ./test/interop/microv2
      - name: Generate and call a fresh service through real etcd
        env:
          KRONOS_ETCD_TEST_ADDRESS: "127.0.0.1:${{ job.services.etcd.ports['2379'] }}"
        run: go -C platform/verify test -count=1 -run '^TestScaffoldBuildsFreshService$' -v ./...

  assistant-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Assistant Compose deployment
        run: go test -tags=e2e -count=1 -v ./test/e2e/assistant
