syntax = "proto3";

package kronos.textbackend.v1;

option go_package = "github.com/fangfengxiang/kronos/examples/textbackend/internal/wire/kronos/textbackend/v1;textbackendv1";

service TextBackendService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}

message GenerateRequest {
  string prompt = 1;
}

message GenerateResponse {
  string text = 1;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_PROMPT = 1;
  ERROR_REASON_GENERATION_FAILED = 2;
}
